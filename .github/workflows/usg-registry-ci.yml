name: USG Registry CI

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "schemas/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/usg-registry-ci.yml"
      - "tests/**"
  pull_request:
    paths:
      - "registry/**"
      - "schemas/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/usg-registry-ci.yml"
      - "tests/**"

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate registry sources
        run: npm run registry:check

      - name: Build registry and run regression tests
        run: npm run registry:test

      - name: Verify generated indexes
        run: npm run registry:verify

